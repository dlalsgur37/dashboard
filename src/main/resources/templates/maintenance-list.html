<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="shortcut icon" type="image/png" href="/images/logos/osangjaiellogo.png"/>
  <link rel="stylesheet" href="/libs/simplebar/dist/simplebar.min.css">
  <link rel="stylesheet" href="/css/styles.min.css"/>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
<!--  Body Wrapper -->
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
     data-sidebar-position="fixed" data-header-position="fixed">
  <!-- Sidebar Start -->
  <aside class="left-sidebar" include-html="/templates/left-panel.html"></aside>
  <!--  Sidebar End -->
  <!--  Main wrapper -->
  <div class="body-wrapper">
    <!--  Header Start -->
    <header class="app-header" include-html="/templates/top-bar.html"></header>
    <!--  Header End -->

    <!-- Content Start -->
    <div class="container-fluid">
      <div class="content-container">
        <button class="open-register-button" id="openRegisterButton"><b>+</b> New</button>
        <button class="delete-button" id="deleteButton" disabled><b>-</b> Delete</button>
        <table id="maintenanceTable" class="maintenance-table display table-row-bordered gy-5" style="width:100%">
          <thead >
          <tr>
            <th></th>
            <th>고객사</th>
            <th>발의자</th>
            <th>발의일자</th>
            <th>담당자</th>
            <th>발의내용</th>
            <th>해결/진행상황</th>
          </tr>
          </thead>
        </table>
      </div>
    </div>
    <!-- Content End -->

    <!-- 등록 모달 창 Start -->
    <div id="suggestionsCustomer" class="suggestions"></div>
    <div class="register-modal" id="registerModal">
      <div class="register-modal-content">
        <div class="register-modal-header">유지보수 등록</div>
        <div class="register-modal-body">
          <form id="register-modal-form">
            <div class="form-row">

              <!--START ---- customer commbo-->

              <label for="register-customer">고객사</label>
              <div class="combobox combobox-list">
                <div class="group">
                  <input id="register-customer" class="cb_edit" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="UL-customerList">
                  <input type="hidden" id="register-customerId" name="register-customerId"  />
                  <button id="customer-button" tabindex="-1" aria-label="States" aria-expanded="true" aria-controls="UL-customerList">
                    <svg width="18" height="16" aria-hidden="false" focusable="false" style="forced-color-adjust:auto">
                      <polygon class="arrow" stroke-width="0" fill-opacity="0.75" fill="currentcolor" points="3,6 15,6 9,14"></polygon>
                    </svg>
                  </button>
                </div>
                <ul id="UL-customerList" role="listbox" aria-label="States" >
                  <!--<li id="lb1-as" role="option">오상헬스케어</li>
                  <li id="lb1-az" role="option">KT&G NGP</li>
                  <li id="lb1-ar" role="option">KT&G 정비부</li>-->
                </ul>
              </div>

              <!--END ---- customer commbo-->



              <label for="register-request_user">발의자</label>
              <input type="text" id="register-request_user" name="register-request_user" required />

              <label for="register-request_date" class="date-label">발의일자</label>
              <input type="text" id="register-request_date" name="register-request_date" placeholder="날짜를 선택하세요">

              <label for="register-owner">담당자</label>
              <!--<input type="text" id="register-owner" name="register-owner" th:value="${username}" required />-->
              <input type="text" id="register-owner" name="register-owner"  required />


            </div>



            <label for="register-editor">내용</label>
            <div id="register-editor"></div>
            <label for="register-solve"> 해결/진행상황</label>
            <input type="text" id="register-solve" name="register--solve" />
          </form>
        </div>


        <div class="register-modal-footer">
          <button class="register-submit-btn" id="registerMaintenance">등록</button>
          <button class="register-close-btn" id="closeRegisterModal">취소</button>
        </div>
      </div>


    </div>
    <!-- 등록 모달 창 End -->



    <!-- 유지보수 정보 모달 창 Start -->
    <div class="info-modal" id="infoModal">
      <div class="info-modal-content">
        <div class="info-modal-body">
          <form id="info-modal-form">
            <label class="maintenance-name" id="maintenance-name"></label>

            <div id="info-editor"></div>
          </form>
        </div>
        <div class="info-modal-footer">
          <button class="info-submit-btn" id="modifiyMaintenance">수정</button>
          <button class="info-submit-btn" id="applyMaintenance" style="display: none">적용</button>
          <button class="info-close-btn" id="closeInfoModal">닫기</button>
        </div>
      </div>
    </div>
    <!-- 유지보수 정보  모달 창 End -->

    <!-- 알림 팝업 Start -->
    <div class="notice-modal" id="noticeModal">
      <div class="notice-modal-content">
        <p class="notice-message" id="noticeMessage"></p>
        <button class="notice-close-btn" id="closeNoticeBtn">확인</button>
      </div>
    </div>
    <!-- 알림 팝업 End -->

    <!-- 오류 팝업 Start -->
    <div class="error-modal" id="errorModal">
      <div class="error-modal-content">
        <p class="error-message" id="errorMessage">알 수 없는 오류가 발생했습니다.</p>
        <button class="error-close-btn" id="closeErrorBtn">닫기</button>
      </div>
    </div>
    <!-- 오류 팝업 End -->

  </div>
</div>

<script src="/js/maintenance.js"></script>
<script src="/libs/jquery/dist/jquery.min.js"></script>
<script src="/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/libs/simplebar/dist/simplebar.js"></script>
<script src="/js/basic-menu.js"></script>
<script src="/js/app.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
<!--  toastui  -->
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
<!--  datatables  -->
<link href="/css/datatables/datatables.css" rel="stylesheet">
<script src="/js/datatables/datatables.js"></script>
<!--  Custom Style  -->
<link rel="stylesheet" href="/css/maintenaceUI.css"/>

<!-- combo auto -->
<link rel="stylesheet" href="/css/combo-auto.css"/>
<script src="/js/combo-auto.js"></script>

<!-- flatpickr-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!--typeahead-->
<script src="/js/typeahead/typeahead.bundle.min.js"></script>

<script>
  includeBasicPanel();
</script>
</body>

</html>
