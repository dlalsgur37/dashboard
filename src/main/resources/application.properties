spring.application.name=dashboard

# datasource
spring.datasource.username=root
spring.datasource.password=root
# prod
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/dashboard
# dev - log4jdbc
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3306/dashboard

# mybatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=true
mybatis.configuration.jdbc-type-for-null=null
mybatis.configuration.aggressive-lazy-loading=false

# if edit html, directly apply.
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.cache=false

# logging
logging.level.root=INFO
logging.level.org.springframework=INFO

# file
file.upload.dir=//172.17.200.121/enovia/upload